name: Other assets checks
on:
  push:
    paths:
      - 'gas_api.js'
      - 'app.js'
      - 'index.html'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test-other-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-stock.txt
      - run: node tests/other-assets.test.cjs
      - run: python tests/stock_prices_test.py
      - name: Live price read (no Google credentials or writes)
        run: python scripts/update_stock_prices.py --check-only
